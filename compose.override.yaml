# Entwicklung: Image lokal bauen und Ports nur auf localhost veröffentlichen.
# Wird von "docker compose" automatisch geladen; auf der VM mit "-f compose.yaml" starten.
x-build: &build
  build: {context: ., dockerfile: docker/Dockerfile}
  image: predictiondb:dev

services:
  postgres:
    ports: ["127.0.0.1:5432:5432"]
  garage:
    ports: ["127.0.0.1:3900:3900", "127.0.0.1:3903:3903"]
  garage-init: *build
  migrate: *build
  ingest-gfs: *build
