# Stack für die PVE-VM (Kapitel 8.2 der Architektur). Lokale Entwicklung: compose.override.yaml.
name: predictiondb

x-app-env: &app-env
  PDB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  PDB_S3_ENDPOINT_URL: http://garage:3900
  PDB_GARAGE_ADMIN_URL: http://garage:3903
  PDB_GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}

x-app: &app
  image: ghcr.io/the78mole/predictiondb:${TAG:-latest}
  env_file: .env
  environment: *app-env
  restart: unless-stopped
  networks: [backend]

services:
  postgres:
    image: timescale/timescaledb:2.31.0-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Verschwindet ein Client ohne Verbindungsabbau (z. B. Container-Neustart beim Deploy),
    # merken die Keepalives das nach ca. 2 min und Postgres gibt seine Sperren frei; sonst
    # wartet ein COPY ewig auf Daten und blockiert alle weiteren Schreiber derselben Chunks.
    # client_connection_check_interval prüft das auch während laufender Anweisungen.
    # Der Leerlauf-Timeout fängt liegengebliebene Transaktionen ab (großzügig wegen
    # Server-Cursorn, die zwischen zwei Abrufen rechnen).
    command:
      - postgres
      - -c
      - tcp_keepalives_idle=60
      - -c
      - tcp_keepalives_interval=10
      - -c
      - tcp_keepalives_count=6
      - -c
      - client_connection_check_interval=10s
      - -c
      - idle_in_transaction_session_timeout=30min
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  garage:
    image: dxflrs/garage:v2.5.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  # Einmalig: Layout, Zugangsschlüssel und Buckets anlegen (idempotent)
  garage-init:
    <<: *app
    restart: "no"
    command: ["pdb-garage-init"]
    depends_on:
      garage: {condition: service_healthy}

  # Einmalig: Datenbankschema auf den neuesten Stand bringen
  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}

  # GFS 0,25° per Partial Download nach Bronze (services/wx_ingest)
  ingest-gfs:
    <<: *app
    command: ["wx-ingest", "gfs", "latest", "--watch", "600"]
    depends_on:
      garage-init: {condition: service_completed_successfully}

  # Day-Ahead-Preise, Last und Erzeugung DE (SMARD, Energy-Charts, ENTSO-E), Brennstoffpreise
  # (EIA, Weltbank, Oil Bulletin, THE), EUR/USD (EZB), Gasspeicher, LNG und Gasbilanz
  # (GIE AGSI+/ALSI, Eurostat) nach energy.*
  # Alle 15 min Abgleich um heute, dazu schrittweise Backfill der Historie seit 2015.
  energy-ingest:
    <<: *app
    command: ["energy-ingest", "sync", "--watch", "900"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  # Nachträgliche Korrekturen der Quellen: letzte 30 Tage je Datensatz einmal am Tag erneut
  # abfragen (energy.value_revision, Alarm "Ist-Last korrigiert"). Eigener Dienst, damit der
  # lange Abgleich-Zyklus ihn nicht aufhält; der Stand je Datensatz liegt in meta.energy_revise.
  energy-revise:
    <<: *app
    command: ["energy-ingest", "revise", "--watch", "3600"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  # MaStR-Gesamtdatenexport einmal je Quartal: Import, Gebietscluster, Tagesbestand
  # (services/mastr_ingest). Prüft alle 6 h, ob im laufenden Quartal schon ein Snapshot liegt.
  mastr-snapshot:
    <<: *app
    command: ["mastr-ingest", "snapshot", "--if-due", "--watch", "21600"]
    depends_on:
      garage-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}

  # Bronze → Silber (Zarr) → Wetter-Features je MaStR-Cluster (services/wx_process).
  # Rechnet alle 10 min die vollständigen Läufe der letzten 48 h, die noch fehlen.
  wx-process:
    <<: *app
    command: ["wx-process", "gfs", "latest", "--watch", "600"]
    depends_on:
      garage-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}

  # GFS-Historie aus dem AWS-Archiv (nur bei Bedarf: docker compose --profile backfill up -d).
  # Ab GFS v16 (2021-03-22 12Z) bis vor das 30-h-Fenster von ingest-gfs, jüngste Läufe zuerst;
  # ein Neustart setzt dort fort, wo er stand. Läufe, deren Silber schon vorliegt (z. B. von
  # wx-import aus GHCR), werden übersprungen; GFS_BACKFILL_BRONZE=true lädt auch für sie Bronze.
  # Läufe per GFS_BACKFILL_RUNS wählbar (Standard 0,12), danach z. B. 6,18 nachziehen.
  # Tempo: GFS_BACKFILL_PARALLEL Läufe gleichzeitig, GFS_BACKFILL_CONCURRENCY Anfragen je
  # Archiv-Endpunkt für alle Läufe zusammen (Engpass ist die Latenz zum Archiv, nicht die CPU).
  gfs-backfill:
    <<: *app
    profiles: [backfill]
    restart: on-failure
    # Zeit für den Abschluss im Backfill-Protokoll, bevor Docker hart beendet
    stop_grace_period: 60s
    command:
      - wx-ingest
      - gfs
      - backfill
      - ${GFS_BACKFILL_START:-2021-03-22T12}
      - --runs=${GFS_BACKFILL_RUNS:-0,12}
      - --newest-first
      - --parallel-runs=${GFS_BACKFILL_PARALLEL:-2}
      - --archive-concurrency=${GFS_BACKFILL_CONCURRENCY:-8}
    depends_on:
      garage-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}

  # Rechnet die nachgeladenen bzw. importierten Läufe stündlich nach Silber und Features
  # (wx-process latest schaut nur 48 h zurück).
  # GFS_PROCESS_RUNS gibt die Laufzeiten in Reihenfolge der Priorität an; Läufe ohne Silber
  # werden übersprungen, die Liste darf also mehr enthalten als gfs-backfill lädt.
  # --decompress entpackt die schon komprimierten Chunks von feat.nwp_value, solange Läufe
  # hineinschreiben (ein COPY in komprimierte Chunks ist etwa dreimal langsamer).
  wx-process-backfill:
    <<: *app
    profiles: [backfill, history]
    # Zeit, um einen laufenden Feature-COPY sauber abzuschließen, bevor Docker hart beendet
    stop_grace_period: 120s
    command:
      - wx-process
      - gfs
      - backfill
      - ${GFS_HISTORY_START:-${GFS_BACKFILL_START:-2021-03-22T12}}
      - --runs=${GFS_PROCESS_RUNS:-0,12,6,18}
      - --newest-first
      - --decompress
      - --watch=3600
    depends_on:
      garage-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}

  # GFS-Historie als Silber aus GHCR (gebaut vom Workflow gfs-history.yml), statt sie über die
  # gedrosselte Leitung aus dem AWS-Archiv zu laden: docker compose --profile history up -d.
  # Holt stündlich neue Läufe nach wx-silver; wx-process-backfill rechnet daraus die Features.
  # GFS_HISTORY_START früher als 2021-03-22T12 holt auch die Läufe vor GFS v16 (NCAR GDEX, nur
  # über GHCR; gfs-backfill bleibt bei GFS_BACKFILL_START, das AWS-Archiv hat sie nicht).
  wx-import:
    <<: *app
    profiles: [history]
    command:
      - wx-exchange
      - gfs
      - import
      - ${GFS_HISTORY_START:-${GFS_BACKFILL_START:-2021-03-22T12}}
      - --runs=${GFS_HISTORY_RUNS:-0,12,6,18}
      - --watch=3600
    depends_on:
      garage-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}

  # GFS 0,5° fürs ganze Verbundnetz (ARCHITEKTUR.md 5.7, Quelle gfs_0p5): gleiche Läufe wie
  # ingest-gfs, aber Produkt pgrb2.0p50 im GEFS-Ausschnitt, nur aus den Archiven (AWS, GCS),
  # damit NOMADS für GFS DE frei bleibt. ≈ 27 MB Bronze je Lauf.
  ingest-gfs-eu:
    <<: *app
    command: ["wx-ingest", "gfs", "--config", "config/sources/gfs_0p5.yaml", "latest", "--watch", "600"]
    depends_on:
      garage-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}

  # Bronze → Silber für gfs_0p5. Gold je Gebotszone folgt mit einer Clusterung für das Gitter
  # gfs_0p5; bis dahin bleibt es beim Silber (Ergebnis silver_only).
  wx-process-eu:
    <<: *app
    command: ["wx-process", "--config", "config/process/gfs_0p5.yaml", "gfs", "latest", "--watch", "600"]
    depends_on:
      garage-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}

  # Historie GFS Europa als Silber aus GHCR (gfs-history.yml mit source=eu, Paket
  # gfs-0p5-silver), wie wx-import.
  wx-import-eu:
    <<: *app
    profiles: [history]
    command:
      - wx-exchange
      - gfs
      - --config=config/sources/gfs_0p5.yaml
      - --process-config=config/process/gfs_0p5.yaml
      - import
      - ${GFS_HISTORY_START:-${GFS_BACKFILL_START:-2021-03-22T12}}
      - --runs=${GFS_HISTORY_RUNS:-0,12,6,18}
      - --watch=3600
    depends_on:
      garage-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}

  # GEFS-Ensemble (ARCHITEKTUR.md 5.6): baut den aktuellen Monat selbst (00Z-Läufe, sobald
  # vollständig), hält die Bronze GEFS_BRONZE_DAYS Tage in wx-bronze und schiebt das Silber nach
  # GHCR (WX_EXCHANGE_TOKEN mit write:packages); abgeschlossene Monate kommen aus GHCR (Actions).
  # Danach Gold (Mittel, Streuung, P10/P90 je Gebotszone) nach feat.nwp_value. Lädt ≈ 3,7 GB je
  # Lauf vom AWS-Archiv.
  wx-gefs:
    <<: *app
    command:
      - wx-exchange
      - gefs
      - vm
      - --history-start=${GEFS_HISTORY_START:-2021-03-22T12}
      - --bronze-days=${GEFS_BRONZE_DAYS:-183}
      # Gold in kleinen Runden (≈ 75 s und 96 000 Werte je Lauf), jüngste Läufe zuerst; jede Runde
      # sieht frisch importierte Monate, und das GFS-Gold wartet nicht lange
      - --gold-limit=${GEFS_GOLD_LIMIT:-12}
      - --watch=1800
    environment:
      <<: *app-env
      WX_EXCHANGE_USERNAME: ${WX_EXCHANGE_USERNAME:-the78mole}
    depends_on:
      garage-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}

  # Prognosemodell Last/Preis DE-LU (services/ml_train, config/ml/de_lu_v1.yaml). Einmalige Jobs:
  #   docker compose --profile ml run --rm ml-train snapshot --out /data/snap
  #   docker compose --profile ml run --rm ml-train backtest --snapshot /data/snap --out /data/bt
  #   docker compose --profile ml run --rm ml-train fit --snapshot /data/snap --variant kalender \
  #     --backtest /data/bt --role champion
  # Backtest für eine schon registrierte Version nachreichen, mit niedriger CPU-Priorität:
  #   docker compose --profile ml run --rm --entrypoint nice ml-train -n 19 ml-train backtest \
  #     --snapshot /data/snap --out /data/bt --variant kalender
  #   docker compose --profile ml run --rm ml-train registry attach-backtest <version> --backtest /data/bt
  # Feste CPU-Grenze, damit Ingest und Verarbeitung nebenher weiterlaufen.
  ml-train:
    <<: *app
    profiles: [ml]
    restart: "no"
    cpus: ${ML_TRAIN_CPUS:-4}
    entrypoint: ["ml-train"]
    command: ["--help"]
    environment:
      <<: *app-env
      PDB_ML_REGISTRY: s3://ml-artifacts/models
      # LightGBM/OpenMP sonst mit einem Thread je Host-Kern: bei cpus-Grenze massive Überbelegung
      OMP_NUM_THREADS: ${ML_TRAIN_CPUS:-4}
    volumes:
      - ml-data:/data
    depends_on:
      migrate: {condition: service_completed_successfully}

  # Inferenz aller aktiven Modellversionen (Linien de_lu_v1 und de_lu_v2) stündlich nach fcst.prediction
  ml-predict:
    <<: *app
    profiles: [ml]
    command: ["ml-train", "predict", "--watch", "3600", "--catch-up", "24", "--fill-new", "216", "--also-config", "config/ml/de_lu_v2.yaml"]
    environment:
      <<: *app-env
      PDB_ML_REGISTRY: s3://ml-artifacts/models
      OMP_NUM_THREADS: ${ML_PREDICT_THREADS:-2}
    depends_on:
      migrate: {condition: service_completed_successfully}

  # Status-Dashboards (config/grafana). Liest über die Rolle grafana_reader (Migration 0004).
  # Port wird erst im Override veröffentlicht (VM: Proxy-Netz, lokal: localhost).
  grafana:
    image: grafana/grafana-oss:13.0.2
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # SQLite im WAL-Modus: Schreibzugriffe (Alarm-Auswertung, Sessions) sperren sonst bei
      # ausgelasteter Platte (Backfills) alle Lesezugriffe, Grafana antwortet dann mit 500.
      GF_DATABASE_WAL: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana-dashboards/prognose-energiedaten.json
      # Deutsches Datums- und Zeitformat an Achsen und in Tabellen
      GF_DATE_FORMATS_FULL_DATE: DD.MM.YYYY HH:mm:ss
      GF_DATE_FORMATS_INTERVAL_SECOND: HH:mm:ss
      GF_DATE_FORMATS_INTERVAL_MINUTE: HH:mm
      GF_DATE_FORMATS_INTERVAL_HOUR: DD.MM. HH:mm
      GF_DATE_FORMATS_INTERVAL_DAY: DD.MM.
      GF_DATE_FORMATS_INTERVAL_MONTH: MM.YYYY
      GF_DATE_FORMATS_INTERVAL_YEAR: YYYY
      GF_DATE_FORMATS_USE_BROWSER_LOCALE: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Europe/Berlin
      POSTGRES_DB: ${POSTGRES_DB}
      PDB_GRAFANA_DB_PASSWORD: ${PDB_GRAFANA_DB_PASSWORD}
      # Alarme per E-Mail (config/grafana/provisioning/alerting); ohne PDB_SMTP_HOST kein Versand
      GF_SMTP_ENABLED: ${PDB_SMTP_HOST:+true}
      GF_SMTP_HOST: ${PDB_SMTP_HOST:-}
      GF_SMTP_USER: ${PDB_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${PDB_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${PDB_SMTP_FROM:-${PDB_SMTP_USER:-predictiondb@predictiondb.invalid}}
      GF_SMTP_FROM_NAME: PredictionDB
      GF_SMTP_STARTTLS_POLICY: ${PDB_SMTP_STARTTLS:-MandatoryStartTLS}
      PDB_ALERT_EMAIL: ${PDB_ALERT_EMAIL:-root@localhost}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana-dashboards:ro
      # Umrisskarte (Natural Earth, gemeinfrei) als Hintergrund des Karten-Dashboards
      - ./config/grafana/maps/umrisse-de.geojson:/usr/share/grafana/public/maps/umrisse-de.geojson:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      migrate: {condition: service_completed_successfully}
      prometheus: {condition: service_started}
    restart: unless-stopped
    networks: [backend, frontend]

  # Systemmetriken für Grafana: Host (node-exporter) und je Container (cAdvisor), 30 Tage
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks: [backend]

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro,rslave"]
    restart: unless-stopped
    networks: [backend]

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    networks: [backend]

  # Weitere Dienste (ml-*, api, mlflow) kommen mit ihren Paketen dazu
  # und hängen von migrate und garage-init ab.

volumes:
  pgdata: {}
  garage-meta: {}
  garage-data: {}
  grafana-data: {}
  prometheus-data: {}
  ml-data: {}

networks:
  backend: {}
  frontend: {}
