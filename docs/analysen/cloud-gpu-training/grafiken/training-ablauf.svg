<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Wöchentliches Training mit gemieteter GPU, Übergabe über GHCR</text>

  <!-- VM -->
  <rect x="20" y="50" width="250" height="250" rx="8" fill="#e8f0fb" stroke="#4a78c2"/>
  <text x="145" y="72" text-anchor="middle" font-weight="bold" fill="#1f3f73">VM (pve2, 8 vCPU)</text>
  <rect x="36" y="86" width="218" height="58" rx="5" fill="#fff" stroke="#4a78c2"/>
  <text x="46" y="106" fill="#222">1  ml-train snapshot</text>
  <text x="46" y="124" fill="#555" font-size="12">Postgres → Parquet, 1,2–1,5 h</text>
  <text x="46" y="139" fill="#555" font-size="12">heute 140 MB, später ≤ 0,7 GB</text>
  <rect x="36" y="222" width="218" height="62" rx="5" fill="#fff" stroke="#4a78c2"/>
  <text x="46" y="242" fill="#222">5  registry import + ml-predict</text>
  <text x="46" y="260" fill="#555" font-size="12">Champion/Challenger wie heute,</text>
  <text x="46" y="275" fill="#555" font-size="12">stündliche Prognose bleibt lokal</text>

  <!-- GHCR -->
  <rect x="325" y="50" width="250" height="250" rx="8" fill="#f4f4f6" stroke="#777"/>
  <text x="450" y="72" text-anchor="middle" font-weight="bold" fill="#222">GHCR (ORAS-Artefakte)</text>
  <rect x="341" y="86" width="218" height="58" rx="5" fill="#fff" stroke="#777"/>
  <text x="351" y="106" fill="#222">…/predictiondb-data/</text>
  <text x="351" y="122" fill="#222">ml-snapshot:JJJJ-MM-TT</text>
  <text x="351" y="139" fill="#555" font-size="12">nur freie Reihen, CC BY 4.0</text>
  <rect x="341" y="222" width="218" height="62" rx="5" fill="#fff" stroke="#777"/>
  <text x="351" y="242" fill="#222">…/predictiondb-models/de_lu</text>
  <text x="351" y="258" fill="#222">challenger-JJJJ-MM-TT</text>
  <text x="351" y="275" fill="#555" font-size="12">Modell + Backtest, 20–100 MB</text>

  <!-- GPU -->
  <rect x="630" y="50" width="250" height="250" rx="8" fill="#e9f6ec" stroke="#3c9a55"/>
  <text x="755" y="72" text-anchor="middle" font-weight="bold" fill="#1d5c2e">vast.ai (RTX 4090, 32+ Kerne)</text>
  <rect x="646" y="86" width="218" height="40" rx="5" fill="#fff" stroke="#3c9a55"/>
  <text x="656" y="104" fill="#222">2  Image ml-train ziehen,</text>
  <text x="656" y="119" fill="#222">Snapshot ziehen (Sekunden)</text>
  <rect x="646" y="134" width="218" height="72" rx="5" fill="#fff" stroke="#3c9a55"/>
  <text x="656" y="153" fill="#222">3  fit + backtest</text>
  <text x="656" y="170" fill="#555" font-size="12">LightGBM auf CPU-Kernen,</text>
  <text x="656" y="185" fill="#555" font-size="12">N-HiTS/TiDE/TFT auf der GPU;</text>
  <text x="656" y="200" fill="#555" font-size="12">selten: Hyperparameter-Suche</text>
  <rect x="646" y="222" width="218" height="62" rx="5" fill="#fff" stroke="#3c9a55"/>
  <text x="656" y="242" fill="#222">4  Ergebnis pushen,</text>
  <text x="656" y="258" fill="#222">Instanz zerstören</text>
  <text x="656" y="275" fill="#555" font-size="12">kein Zustand bleibt beim Host</text>

  <!-- Pfeile -->
  <line x1="254" y1="115" x2="339" y2="115" stroke="#555" stroke-width="1.6" marker-end="url(#pf)"/>
  <text x="296" y="108" text-anchor="middle" fill="#a03030" font-size="11">8,3 MB/s</text>
  <line x1="559" y1="105" x2="644" y2="105" stroke="#555" stroke-width="1.6" marker-end="url(#pf)"/>
  <line x1="755" y1="206" x2="755" y2="220" stroke="#555" stroke-width="1.6" marker-end="url(#pf)"/>
  <line x1="644" y1="253" x2="561" y2="253" stroke="#555" stroke-width="1.6" marker-end="url(#pf)"/>
  <line x1="339" y1="253" x2="256" y2="253" stroke="#555" stroke-width="1.6" marker-end="url(#pf)"/>
  <text x="296" y="246" text-anchor="middle" fill="#a03030" font-size="11">8,3 MB/s</text>
  <line x1="755" y1="126" x2="755" y2="132" stroke="#555" stroke-width="1.6" marker-end="url(#pf)"/>

  <rect x="20" y="318" width="860" height="66" rx="6" fill="#fffbe6" stroke="#c9b23b"/>
  <text x="32" y="340" fill="#222">Über die gedrosselte VM-Leitung gehen je Woche nur ca. 0,2–0,8 GB (unter 2 min). Der Engpass ist der Snapshot-Export</text>
  <text x="32" y="358" fill="#222">auf der VM, nicht der Transfer. Silber (≈ 57 GB für 3 Jahre) braucht der GPU-Host nicht, Gold in den Actions zu rechnen</text>
  <text x="32" y="376" fill="#222">ist dafür nicht nötig. Die VM bleibt Quelle der Wahrheit für Daten, Registry und laufende Prognosen.</text>
</svg>
