# Alarme per E-Mail. SMTP-Zugang und Empfänger kommen aus der Umgebung (compose.yaml, .env:
# PDB_SMTP_*, PDB_ALERT_EMAIL). Ohne PDB_SMTP_HOST bleibt der Versand aus, die Alarme sind in
# Grafana trotzdem sichtbar. Änderungen in der Oberfläche überschreibt der nächste Neustart.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: E-Mail Betrieb
    receivers:
      - uid: pdb-email
        type: email
        settings:
          addresses: ${PDB_ALERT_EMAIL}
          singleEmail: true

policies:
  - orgId: 1
    receiver: E-Mail Betrieb
    group_by: [alertname]
    group_wait: 1m
    group_interval: 30m
    repeat_interval: 24h

groups:
  - orgId: 1
    name: Datenquellen
    folder: PredictionDB
    interval: 5m
    rules:
      # Aufbau einer Antwort weicht ab (Spalte, Blatt, Einheit); der Abruf schreibt nichts
      - uid: pdb-source-format
        title: Datenquelle - Format geändert
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: pdb-postgres
            model:
              refId: A
              format: table
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT src.code AS source, e.dataset, left(coalesce(e.error, ''), 300) AS error,
                       1 AS value
                  FROM meta.energy_status e
                  JOIN meta.source src USING (source_id)
                 WHERE e.status = 'format' AND src.enabled
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: "Format von {{ $labels.source }}/{{ $labels.dataset }} geändert"
          description: >-
            {{ $labels.error }}. Der Import dieser Quelle ist angehalten, bis der Parser
            angepasst ist (services/energy_ingest/src/energy_ingest/sources).
        labels:
          severity: warning

      # Abruf scheitert seit mindestens 24 h (Netz, Adresse, Zugang)
      - uid: pdb-source-failing
        title: Datenquelle - Abruf scheitert seit 24 h
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: pdb-postgres
            model:
              refId: A
              format: table
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT src.code AS source, e.dataset, left(coalesce(e.error, ''), 300) AS error,
                       1 AS value
                  FROM meta.energy_status e
                  JOIN meta.source src USING (source_id)
                 WHERE e.status = 'failed' AND src.enabled
                   AND coalesce(e.last_ok_at, '-infinity') < now() - interval '24 hours'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: "Abruf {{ $labels.source }}/{{ $labels.dataset }} scheitert seit 24 h"
          description: "{{ $labels.error }}"
        labels:
          severity: warning

      # Jüngster Wert einer Reihe älter als erwartet (energy.series_freshness). Reihen, die
      # seit mehr als 180 Tagen darüber liegen, gelten als eingestellt und melden nicht mehr.
      - uid: pdb-series-stale
        title: Datenquelle - Reihe veraltet
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: pdb-postgres
            model:
              refId: A
              format: table
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT source, code, to_char(last_ts, 'YYYY-MM-DD') AS last_value,
                       1 AS value
                  FROM energy.series_freshness
                 WHERE enabled AND last_ts < now() - max_age
                   AND last_ts > now() - max_age - interval '180 days'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 1h
        annotations:
          summary: "Reihe {{ $labels.source }}/{{ $labels.code }} veraltet"
          description: >-
            Letzter Wert vom {{ $labels.last_value }}. Bei Weltbank und Oil Bulletin hat sich
            vermutlich die Download-Adresse geändert (PDB_ENERGY_WORLDBANK_URL,
            PDB_ENERGY_OIL_BULLETIN_URL).
        labels:
          severity: warning

      # Quelle hat bereits gespeicherte Ist-Lastwerte nachträglich korrigiert oder entfernt
      # (energy.value_revision). Nur Änderungen über 1 % an Werten, die beim Abruf schon älter
      # als 12 h waren: Energy-Charts liefert frische Viertelstunden zunächst vorläufig (bis
      # +20 % binnen weniger Stunden), echte Nachbesserungen kommen erst später.
      - uid: pdb-load-revised
        title: Datenquelle - Ist-Last korrigiert
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: pdb-postgres
            model:
              refId: A
              format: table
              rawQuery: true
              editorMode: code
              rawSql: |
                WITH r AS (
                  SELECT src.code AS source, r.ts, r.old_value, r.new_value
                    FROM energy.value_revision r
                    JOIN energy.series s USING (series_id)
                    JOIN meta.source src ON src.source_id = s.source_id
                   WHERE s.code = 'load_actual' AND src.enabled
                     AND r.revised_at > now() - interval '24 hours'
                     AND r.ts < r.revised_at - interval '12 hours'
                     AND (r.old_value IS NULL OR r.new_value IS NULL
                          OR abs(r.new_value - r.old_value) > 0.01 * abs(r.old_value))
                )
                SELECT source,
                       to_char(min(ts) AT TIME ZONE 'Europe/Berlin', 'DD.MM.YYYY HH24:MI') AS von,
                       to_char(max(ts) AT TIME ZONE 'Europe/Berlin', 'DD.MM.YYYY HH24:MI') AS bis,
                       coalesce(round(max(abs(new_value - old_value)))::text, '-') AS max_mw,
                       count(*) FILTER (WHERE new_value IS NULL)::text AS entfernt,
                       count(*) AS value
                  FROM r
                 GROUP BY source
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: "Ist-Last von {{ $labels.source }} nachträglich korrigiert"
          description: >-
            {{ $values.A.Value }} Werte zwischen {{ $labels.von }} und
            {{ $labels.bis }} (Ortszeit) haben sich geändert, davon {{ $labels.entfernt }}
            entfernt; größte Änderung {{ $labels.max_mw }} MW. Alte und neue Werte stehen in
            energy.value_revision.
        labels:
          severity: info

  - orgId: 1
    name: System
    folder: PredictionDB
    interval: 5m
    rules:
      # Partition der VM zu mehr als 90 % belegt (wie df, node-exporter). Gleiche Auswahl der
      # Dateisysteme wie im Dashboard „System“ (Abschnitt Speicher).
      - uid: pdb-disk-full
        title: System - Partition zu 90 % belegt
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: pdb-prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: >-
                100 * (node_filesystem_size_bytes{job="node",fstype!~"tmpfs|ramfs|devtmpfs|overlay|squashfs|nsfs|autofs|fuse.*",mountpoint!~"/boot.*"}
                - node_filesystem_free_bytes{job="node",fstype!~"tmpfs|ramfs|devtmpfs|overlay|squashfs|nsfs|autofs|fuse.*",mountpoint!~"/boot.*"})
                / (node_filesystem_size_bytes{job="node",fstype!~"tmpfs|ramfs|devtmpfs|overlay|squashfs|nsfs|autofs|fuse.*",mountpoint!~"/boot.*"}
                - node_filesystem_free_bytes{job="node",fstype!~"tmpfs|ramfs|devtmpfs|overlay|squashfs|nsfs|autofs|fuse.*",mountpoint!~"/boot.*"}
                + node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|ramfs|devtmpfs|overlay|squashfs|nsfs|autofs|fuse.*",mountpoint!~"/boot.*"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [90]}
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: "Partition {{ $labels.mountpoint }} zu {{ printf \"%.0f\" $values.A.Value }} % belegt"
          description: >-
            {{ $labels.mountpoint }} ({{ $labels.device }}) hat weniger als 10 % frei. Auf
            /var/lib/docker liegen alle Volumes (Postgres, Garage, Prometheus); Platte in
            Proxmox vergrößern oder alte Daten aufräumen.
        labels:
          severity: warning
