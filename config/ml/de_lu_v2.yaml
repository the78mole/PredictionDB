# Zweites Prognosemodell: wie de_lu_v1, zusätzlich freie Reihen als eigene Merkmalsgruppen
# (Nachbarzonen-Preise, Lastprognose der ÜNB, Brennstoffpreise, eigene Marktwerte).
# Nur Reihen freier Quellen (keine PDB_ALLOW_*-Quellen), weil Modelle frei veröffentlicht werden.
# Siehe services/ml_train/README.md und docs/ARCHITEKTUR.md Kap. 7.3, 7.4 und 7.7.
name: de_lu_v2
title: Last DE und Day-Ahead-Preis DE-LU, zweistufig, mit freien Zusatzreihen
quantiles: [0.1, 0.5, 0.9]

issue:
  hour_utc: 8                  # vor Gebotsschluss (12 Uhr Ortszeit = 10/11 UTC)
  # Training reihum zu vier Tageszeiten: ml-predict rechnet stündlich, gelernt war bisher nur
  # 08 UTC (nach 13 Uhr ist der Preis des Folgetags bekannt und wird übernommen, nicht gelernt)
  hours_utc: [2, 8, 14, 20]
  lead_days: [0, 1, 2, 3, 4, 5, 6, 7]   # 0 = Rest des Ausgabetags
  actual_delay_h: 2            # Ist-Werte ab Intervallende + 2 h bekannt
  price_known_local_hour: 13   # Auktionsergebnis D+1 ab 13 Uhr am Vortag
  nwp_delay_h: 6               # GFS-Lauf vollständig verarbeitet ca. 5,5 h nach Laufzeit

# Stufe 1: Last, Wind, PV; Wind und PV als Kapazitätsfaktor (MaStR-Bestand)
stage1:
  - code: load_actual
    role: load
    benchmarks: [load_da_forecast]
  - code: gen_wind_onshore
    role: generation
    normalize_by: [cap_wind_on]
    benchmarks: [gen_da_forecast_wind_onshore]
  - code: gen_wind_offshore
    role: generation
    normalize_by: [cap_wind_off]
    benchmarks: [gen_da_forecast_wind_offshore]
  - code: gen_solar
    role: generation
    normalize_by: [cap_pv]
    benchmarks: [gen_da_forecast_solar]

# Stufe 2: Preis mit Stufe-1-Prognosen und Residuallast, relativ zum Mittel des letzten bekannten
# Liefertags (im Backtest H2 2025 besser als das 7-Tage-Mittel: MAE D+1 21,4 statt 22,3 EUR/MWh)
stage2:
  - code: da_price_de_lu
    role: price
    center: lag_da_price_de_lu_mean_day

lag_series: [residual_load]
# Lags der Last über dieselbe Uhrzeit in Ortszeit statt k·24 h: sonst liegt der Morgenanstieg
# nach einer Zeitumstellung eine Woche lang eine Stunde daneben (docs/analysen/zeitumstellung).
# PV folgt der Sonne (UTC), Preis und Residuallast sind neutral; die bleiben bei k·24 h.
lag_local_time: [load_actual]

series_groups:
  # Wind- und PV-Index der Nachbarn (6 Kennzahlen), braucht neighbour_weather
  nachbarindex:
    mode: nachbarindex
    codes: [cap_wind_onshore_at, cap_solar_at, cap_wind_onshore_be, cap_wind_offshore_be,
            cap_solar_be, cap_wind_onshore_ch, cap_solar_ch, cap_wind_onshore_cz, cap_solar_cz,
            cap_wind_onshore_dk, cap_wind_offshore_dk, cap_solar_dk, cap_wind_onshore_fr,
            cap_wind_offshore_fr, cap_solar_fr, cap_wind_onshore_nl, cap_wind_offshore_nl,
            cap_solar_nl, cap_wind_onshore_no, cap_solar_no, cap_wind_onshore_pl, cap_solar_pl,
            cap_wind_onshore_se, cap_solar_se]
  # Day-Ahead-Preise der Nachbarzonen (Energy-Charts, CC BY 4.0), bekannt wie der Preis DE-LU
  nachbarn:
    mode: lags
    codes: [da_price_at, da_price_be, da_price_ch, da_price_cz, da_price_dk1, da_price_dk2,
            da_price_fr, da_price_hu, da_price_it_north, da_price_nl, da_price_no2, da_price_pl,
            da_price_se4, da_price_si]
    lags: [day, mean_day, mean_7d]
  # Day-Ahead-Lastprognose der ÜNB (SMARD bzw. ENTSO-E 6.1.b, frei), bis 10 Uhr am Vortag
  lastprognose:
    mode: forecast
    codes: [load_da_forecast]
    known_local_hour: 10
  # Brennstoffe und Wechselkurs: EZB, EIA (ULSD, Public Domain), Oil Bulletin, Weltbank
  brennstoffe:
    mode: asof
    codes: [fx_usd_eur, oil_ulsd_nyh, oil_ulsd_usgc, retail_de_diesel_net,
            retail_de_heating_oil_net, gas_eu_m, lng_japan_m, gas_henry_hub_m, coal_au_m,
            coal_za_m, oil_brent_m]
    change_days: 28
  # Gegenprobe: längeres Preisgedächtnis aus dem eigenen Preis DE-LU (keine neue Quelle).
  # Prüft, ob Brennstoffe, Marktwerte und Nachbarpreise nur als Preisniveau über Wochen wirken
  preisniveau:
    mode: lags
    codes: [da_price_de_lu]
    lags: [mean_28d]
  # Erwartete Brennstoffpreisänderung 1-3 Monate aus dem jüngsten EIA Short-Term Energy Outlook
  # (gemeinfrei, Quelle eia_steo); im Preisniveau-Backtest (docs/analysen/preisniveau-schaetzung)
  # trug sie Information über die Richtung des Monatsmittels
  steo:
    mode: outlook
    codes: [steo_brent, steo_henry_hub]
    horizons: [1, 2, 3]
  # Implizites Brennstoff- und CO2-Niveau aus SMARD: Preis in Stunden hoher Residuallast (Gas,
  # Steinkohle preissetzend) und in Braunkohle-Stunden (folgt dem CO2-Preis), je 14/28/56 Tage.
  # Täglich und frei statt TTF/EUA (unfrei); docs/analysen/eua-rueckrechnung,
  # docs/analysen/preisabweichung-2026-10-29
  grenzkosten:
    mode: grenzkosten
    codes: [da_price_de_lu]
    windows: [14, 28, 56]
  # Marktwerte nach EEG, selbst aus SMARD berechnet (Quelle pdb_marktwert)
  marktwerte:
    mode: asof
    codes: [mw_base, mw_wind_onshore, mw_wind_offshore, mw_solar, jw_base, jw_wind_onshore,
            jw_wind_offshore, jw_solar]
    change_days: 35
  # Kühlwasserlage der französischen Kernkraftwerke (Abflüsse Hub'eau, Temperatur am Standort
  # aus site_weather), braucht site_weather
  kuehlwasser:
    mode: kuehlwasser
    codes: [river_flow_rhone_lagnieu, river_flow_rhone_st_rambert, river_flow_rhone_ternay,
            river_flow_rhone_viviers, river_flow_garonne_lamagistere, river_flow_moselle_uckange,
            river_flow_meuse_chooz]

# Wind- und PV-Index der Nachbarzonen aus dem Gold von GFS Europa (gfs_0p5, Flächenmittel je
# Zone aus regions_v2), Gruppe nachbarwetter. Im Analyse-Backtest erklärte das Netto-Import und
# Grenzflüsse deutlich besser, den Preis etwas (docs/analysen/austausch-nachbarlaender).
# Zonen mit Grenze bzw. Kabel zu DE-LU.
# Verdichtet: installierte Wind- und PV-Leistung je Nachbarland (Energy-Charts, je Jahr) mal
# mittlerem Kapazitätsfaktor seiner Zonen, als Summe in MW und leistungsgewichteter Faktor
# (Gruppe nachbarindex, 6 Merkmale statt 22 in nachbarwetter).
neighbour_weather:
  source: gfs_0p5
  zones: [AT, BE, CH, CZ, DK1, DK2, FR, NL, NO2, PL, SE4]
  features: [wind_cf, pv_cf]

# Französische Kernkraftwerke mit umweltbedingter Drosselung 2021 bis 2026
# (docs/analysen/kkw-kuehlwasser-fr): Lufttemperatur am Gitterpunkt aus dem Gold von GFS Europa
# (Regionen config/process/kkw_standorte.json, Version sites_kkw_v1), Abfluss am Pegel davor.
# Leistung aus tabellen/standorte.csv, Schwellen aus tabellen/schwellen.csv (Beginn des steilen
# Anstiegs der Tage mit Drosselung). Saint-Alban: Saint-Rambert ab 07/2024, davor Ternay.
site_weather:
  source: gfs_0p5
  features: [t2m]
  sites:
    - {code: BUG, mw: 3630, flows: [river_flow_rhone_lagnieu], t7_from: 22}
    - code: SAL
      mw: 2638
      flows: [river_flow_rhone_st_rambert, river_flow_rhone_ternay]
      t7_from: 24
      flow_below: 0.5
    - {code: TRI, mw: 3739, flows: [river_flow_rhone_viviers], t7_from: 24, flow_below: 0.5}
    - {code: BLA, mw: 3773, t7_from: 24}
    - {code: GOL, mw: 2632, flows: [river_flow_garonne_lamagistere], t7_from: 24, flow_below: 0.5}
    - {code: CAT, mw: 5198, flows: [river_flow_moselle_uckange], t7_from: 22, flow_below: 0.3}
    - {code: CHO, mw: 3007, flows: [river_flow_meuse_chooz], t7_from: 22, flow_below: 0.3}

variants:
  # Maßstab wie de_lu_v1/kalender: Kalender, Lags, Bestand; ab Start der Gebotszone DE-LU
  - name: kalender
    groups: [calendar, lags, capacity, stage1]
    train_from: 2018-10-08
  # je eine neue Gruppe dazu (Ablation)
  - name: nachbarn
    groups: [calendar, lags, capacity, nachbarn, stage1]
    train_from: 2018-10-08
  - name: lastprognose
    groups: [calendar, lags, capacity, lastprognose, stage1]
    train_from: 2018-10-08
  - name: brennstoffe
    groups: [calendar, lags, capacity, brennstoffe, stage1]
    train_from: 2018-10-08
  - name: marktwerte
    groups: [calendar, lags, capacity, marktwerte, stage1]
    train_from: 2018-10-08
  # alle freien Zusatzreihen
  - name: frei
    groups: [calendar, lags, capacity, nachbarn, lastprognose, brennstoffe, marktwerte, stage1]
    train_from: 2018-10-08
  # Gegenprobe Preisniveau: Maßstab bzw. alle freien Reihen, je mit 28-Tage-Mittel des Preises
  - name: preisniveau
    groups: [calendar, lags, capacity, preisniveau, stage1]
    train_from: 2018-10-08
  - name: frei_niveau
    groups: [calendar, lags, capacity, nachbarn, lastprognose, brennstoffe, marktwerte,
             preisniveau, stage1]
    train_from: 2018-10-08
  # Preisniveau (28-Tage-Mittel) mit erwarteter Brennstoffänderung aus dem STEO, allein und
  # mit allen freien Reihen
  - name: steo
    groups: [calendar, lags, capacity, preisniveau, steo, stage1]
    train_from: 2018-10-08
  - name: frei_steo
    groups: [calendar, lags, capacity, nachbarn, lastprognose, brennstoffe, marktwerte,
             preisniveau, steo, stage1]
    train_from: 2018-10-08
  # Grenzkostenindex als Merkmal, und zusätzlich der Preis relativ zu diesem Niveau gelernt
  # (Abweichung vom Vortagesmittel geteilt durch gk_niveau): Bäume extrapolieren nicht über das
  # Preisniveau der Trainingszeit hinaus
  - name: frei_gk
    groups: [calendar, lags, capacity, nachbarn, lastprognose, brennstoffe, marktwerte,
             grenzkosten, stage1]
    train_from: 2018-10-08
  - name: frei_gk_skaliert
    groups: [calendar, lags, capacity, nachbarn, lastprognose, brennstoffe, marktwerte,
             grenzkosten, stage1]
    scale: {da_price_de_lu: gk_niveau}
    train_from: 2018-10-08
  # mit GFS-Features je Technologie, nur Ausgabezeitpunkte mit Wetterlauf
  - name: wetter
    groups: [calendar, lags, capacity, weather, stage1]
    requires_weather: true
    train_from: 2021-03-23
  - name: wetter_frei
    groups: [calendar, lags, capacity, weather, nachbarn, lastprognose, brennstoffe, marktwerte,
             stage1]
    requires_weather: true
    train_from: 2021-03-23
  - name: wetter_frei_gk_skaliert
    groups: [calendar, lags, capacity, weather, nachbarn, lastprognose, brennstoffe, marktwerte,
             grenzkosten, stage1]
    scale: {da_price_de_lu: gk_niveau}
    requires_weather: true
    train_from: 2021-03-23
  # dazu Wind und PV der Nachbarzonen (Ablation gegen wetter bzw. wetter_frei_gk_skaliert)
  - name: wetter_nachbarwetter
    groups: [calendar, lags, capacity, weather, nachbarwetter, stage1]
    requires_weather: true
    train_from: 2021-03-23
  - name: wetter_frei_gk_skaliert_nachbarwetter
    groups: [calendar, lags, capacity, weather, nachbarwetter, nachbarn, lastprognose,
             brennstoffe, marktwerte, grenzkosten, stage1]
    scale: {da_price_de_lu: gk_niveau}
    requires_weather: true
    train_from: 2021-03-23
  # statt der 22 Zonenmerkmale nur der verdichtete Index
  - name: wetter_frei_gk_skaliert_nachbarindex
    groups: [calendar, lags, capacity, weather, nachbarindex, nachbarn, lastprognose,
             brennstoffe, marktwerte, grenzkosten, stage1]
    scale: {da_price_de_lu: gk_niveau}
    requires_weather: true
    train_from: 2021-03-23
  # dazu die Kühlwasserlage der französischen Kernkraftwerke (Ablation gegen
  # wetter_frei_gk_skaliert)
  - name: wetter_frei_gk_skaliert_kuehlwasser
    groups: [calendar, lags, capacity, weather, kuehlwasser, nachbarn, lastprognose,
             brennstoffe, marktwerte, grenzkosten, stage1]
    scale: {da_price_de_lu: gk_niveau}
    requires_weather: true
    train_from: 2021-03-23

lgbm:
  num_leaves: 63
  learning_rate: 0.05
  n_estimators: 400
  min_child_samples: 50
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0

# Quantile je Ziel und Vorlauftag nachkalibrieren: P10–P90 enthielt im Backtest nur 55–70 %
# statt 80 % der Ist-Werte (docs/analysen/prognose-de-lu-v2)
calibration:
  months: 12

backtest:
  test_from: 2024-01-01
  fold_months: 6
  gap_days: 8
  oof_folds: 3
  train_issue_stride: 2

# Festes Vergleichsfenster (Ausgabetage): Jeder Backtest, der es vollständig abdeckt, wird hier
# zusätzlich bewertet, damit Läufe mit verschiedenen Testzeiträumen vergleichbar sind
# (docs/BACKTEST.md Kap. 7). Nur bewusst verschieben, dann mit neuem Namen.
compare:
  name: w2024_2025
  start: 2024-01-01
  end: 2025-12-31

# Mitlaufendes Vergleichsfenster: die letzten 24 Monate bis zum Ende des Vormonats (until: month)
# bzw. der letzten vollen Jahreszeit (until: season), Name z. B. roll_24m_202411_202610.
# ml-train backtest --rolling rechnet genau diesen Zeitraum.
compare_rolling:
  months: 24
  until: month

promotion:
  min_gain: 0.0
  max_group_loss: 0.05
  min_group_n: 200
