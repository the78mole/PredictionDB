[project]
name = "gribkit"
version = "0.1.0"
description = "GRIB2-Werkzeuge: .idx-Parser, Range-Merging und Zuschnitt auf einen Ausschnitt"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-BUSL-1.1"
dependencies = [
    "eccodes>=2.40",
    "eccodeslib>=2.40",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gribkit"]
