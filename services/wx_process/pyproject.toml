[project]
name = "wx-process"
version = "0.1.0"
description = "Bronze → Silber → Gold: GRIB2 nach Zarr und Wetter-Features je Anlagen-Cluster"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-BUSL-1.1"
dependencies = [
    "gribkit~=0.2",
    "predictiondb-core",
    "wx-ingest",
    "numpy>=2.1",
    "obstore>=0.6",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "zarr>=3.1",
]

[project.scripts]
wx-process = "wx_process.cli:main"

[tool.uv.sources]
predictiondb-core = { workspace = true }
wx-ingest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wx_process"]
