[project]
name = "wx-ingest"
version = "0.1.0"
description = "Ingest numerischer Wettermodelle (zuerst NOAA GFS 0,25°) nach Garage-S3 (Bronze)"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-BUSL-1.1"
dependencies = [
    "gribkit~=0.2",
    "predictiondb-core",
    "aiolimiter>=1.1",
    "httpx>=0.27",
    "obstore>=0.6",
    "pydantic>=2.7",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "tenacity>=8.5",
]

[project.scripts]
wx-ingest = "wx_ingest.cli:main"

[tool.uv.sources]
predictiondb-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wx_ingest"]
