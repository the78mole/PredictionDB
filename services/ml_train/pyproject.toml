[project]
name = "ml-train"
version = "0.1.0"
description = "Prognosemodelle für Netzlast und Day-Ahead-Preis DE-LU: Snapshot, Training, Backtest, Registry und Inferenz"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-BUSL-1.1"
dependencies = [
    "predictiondb-core",
    "holidays>=0.60",
    "lightgbm>=4.5",
    "numpy>=2.1",
    "obstore>=0.6",
    "pandas>=2.2",
    "pyarrow>=18",
    "pydantic>=2.10",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9"]

[project.scripts]
ml-train = "ml_train.cli:main"

[tool.uv.sources]
predictiondb-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_train"]
