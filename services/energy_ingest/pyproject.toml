[project]
name = "energy-ingest"
version = "0.1.0"
description = "Ingest von Day-Ahead-Preisen, Last und Erzeugung für Deutschland (SMARD, Energy-Charts, ENTSO-E)"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-BUSL-1.1"
dependencies = [
    "predictiondb-core",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "tenacity>=8.5",
]

[project.scripts]
energy-ingest = "energy_ingest.cli:main"

[tool.uv.sources]
predictiondb-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_ingest"]
