[project]
name = "predictiondb"
version = "0.1.0"
description = "Strombedarfs- und Strompreisprognose für Deutschland auf Basis kostenfreier Wetter- und Energiedaten"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-BUSL-1.1"
license-files = ["LICENSE"]
dependencies = ["predictiondb-core"]

[dependency-groups]
dev = [
    "hypothesis>=6.170",
    "mypy>=1.13",
    "pre-commit>=4.7.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-html>=4.1",
    "ruff>=0.8",
    "strictdoc>=0.30.4",
    "types-PyYAML",
]
fuzz = [
    "atheris>=3.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*", "predict"]

[tool.uv.sources]
predictiondb-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["predictiondb_core", "gribkit", "wx_ingest", "energy_ingest", "mastr_ingest", "wx_process", "wx_exchange", "ml_train", "pdb_predict"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "packages/core/src",
    "packages/gribkit/src",
    "services/wx_ingest/src",
    "services/energy_ingest/src",
    "services/mastr_ingest/src",
    "services/wx_process/src",
    "services/wx_exchange/src",
    "services/ml_train/src",
    "predict/src",
]
explicit_package_bases = true
files = ["."]
# Analyse-Skripte heißen alle auswertung.py und werden in der CI einzeln geprüft
exclude = ["^\\.venv/", "^build/", "^docs/analysen/"]

[[tool.mypy.overrides]]
module = [
    "obstore.*", "eccodes.*", "gribapi.*", "lxml.*", "matplotlib.*", "lightgbm.*", "holidays.*",
    "pandas.*", "pyarrow.*", "scipy.*", "openpyxl.*", "strictdoc.*", "atheris",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "services", "predict", "tests"]
addopts = ["-ra", "-m", "not network"]
asyncio_mode = "auto"
# Veraltete APIs sollen im Test auffallen, nicht erst beim Entfernen.
filterwarnings = [
    "error::DeprecationWarning",
    "error::FutureWarning",
]
markers = [
    "network: braucht Internetzugang zu externen Quellen (mit -m network ausführen)",
    "integration: benötigt laufende Dienste (Postgres, Garage) aus compose.yaml",
]
