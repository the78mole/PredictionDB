[project]
name = "predictiondb"
version = "0.1.0"
description = "Strombedarfs- und Strompreisprognose für Deutschland auf Basis kostenfreier Wetter- und Energiedaten"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-BUSL-1.1"
license-files = ["LICENSE"]
dependencies = ["predictiondb-core"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-PyYAML",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
predictiondb-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["predictiondb_core", "gribkit", "wx_ingest"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/core/src", "packages/gribkit/src", "services/wx_ingest/src"]
explicit_package_bases = true
files = ["."]
exclude = ["^\\.venv/", "^build/"]

[[tool.mypy.overrides]]
module = ["obstore.*", "eccodes.*", "gribapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tests"]
addopts = ["-ra", "-m", "not network"]
asyncio_mode = "auto"
markers = [
    "network: braucht Internetzugang zu externen Quellen (mit -m network ausführen)",
    "integration: benötigt laufende Dienste (Postgres, Garage) aus compose.yaml",
]
