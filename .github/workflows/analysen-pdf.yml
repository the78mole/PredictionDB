name: Analysen als PDF

# Rendert docs/analysen/*/README.md samt Grafiken zu je einem PDF
# (scripts/analysen-pdf.sh). Mit Tag hängen die PDFs als Assets am Release;
# sonst liegen sie als Workflow-Artefakt bereit. Der Release-Workflow ruft
# diesen Workflow nach jedem neuen Release auf (workflow_call).
#
# Neu gerendert werden nur Analysen, deren Ordner sich seit dem vorherigen
# Release (bei PRs: seit dem Basis-Commit) geändert hat, oder alle, wenn sich
# der Renderer geändert hat (scripts/analysen-pdf-auswahl.sh). Die übrigen PDFs
# übernimmt der schlanke Job "auswahl" aus dem vorherigen Release, damit jedes
# Release alle PDFs trägt. Pandoc und Chrome braucht nur der Job "pdf" (Container
# ghcr.io/the78mole/pandoc-chromium), der entfällt, wenn nichts zu rendern ist.
on:
  workflow_call:
    inputs:
      tag:
        description: Release-Tag, an das die PDFs gehängt werden
        type: string
        required: true
  release:
    types: [published]  # von Hand angelegte Releases
  pull_request:
    paths:
      - docs/analysen/**
      - scripts/analysen-pdf*
      - .github/workflows/analysen-pdf.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release-Tag, an das die PDFs gehängt werden (leer = alle als Artefakt)
        required: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  auswahl:
    name: Analysen-PDFs auswählen und übernehmen
    # Releases des Prognose-Stacks (predict/v*, predict.yml) tragen keine Analysen
    if: ${{ !startsWith(github.event.release.tag_name || inputs.tag || '', 'predict/') }}
    runs-on: ubuntu-26.04
    concurrency:
      group: analysen-pdf-auswahl-${{ github.event.release.tag_name || inputs.tag || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write  # gh release upload
    outputs:
      rendern: ${{ steps.uebernehmen.outputs.rendern }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
          fetch-depth: 0  # vorheriger Tag und Diff je Analyse
      - name: Basis bestimmen
        id: basis
        env:
          PR_BASIS: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n $TAG ]]; then
            basis=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$TAG^" 2>/dev/null || true)
          else
            basis=$PR_BASIS  # leer bei workflow_dispatch ohne Tag: alles rendern
          fi
          echo "basis=$basis" | tee -a "$GITHUB_OUTPUT"
      - name: Geänderte Analysen
        id: auswahl
        run: scripts/analysen-pdf-auswahl.sh "${{ steps.basis.outputs.basis }}"
      - name: Unveränderte PDFs aus dem vorherigen Release übernehmen
        id: uebernehmen
        env:
          GH_TOKEN: ${{ github.token }}
          BASIS: ${{ steps.basis.outputs.basis }}
          RENDERN: ${{ steps.auswahl.outputs.rendern }}
          UEBERNEHMEN: ${{ steps.auswahl.outputs.uebernehmen }}
        run: |
          rendern=$RENDERN
          if [[ -n $TAG ]]; then
            mkdir -p dist/analysen
            for name in $UEBERNEHMEN; do
              # Fehlt das PDF im vorherigen Release, wird es doch gerendert.
              gh release download "$BASIS" -p "analyse-$name.pdf" -D dist/analysen --clobber \
                || rendern="$rendern $name"
            done
            shopt -s nullglob
            pdfs=(dist/analysen/*.pdf)
            if [[ ${#pdfs[@]} -gt 0 ]]; then
              gh release upload "$TAG" "${pdfs[@]}" --clobber
            fi
          fi
          # Ohne Tag (PR) gibt es nichts zu übernehmen; das Artefakt enthält
          # nur die geänderten Analysen.
          echo "rendern=${rendern# }" | tee -a "$GITHUB_OUTPUT"

  pdf:
    name: Analysen-PDFs rendern
    needs: auswahl
    if: needs.auswahl.outputs.rendern != ''
    runs-on: ubuntu-26.04
    # Pandoc, Chromium, git und gh fertig installiert (the78mole/docker-images).
    container: ghcr.io/the78mole/pandoc-chromium:latest
    defaults:
      run:
        shell: bash  # im Container wäre sonst sh die Vorgabe
    concurrency:
      group: analysen-pdf-${{ github.event.release.tag_name || inputs.tag || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write  # gh release upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
          fetch-depth: 0  # Stand je Analyse aus git log, Version aus git describe
      - name: Workspace für git freigeben  # Container läuft als root
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: PDFs rendern
        env:
          PDF_VERSION: ${{ env.TAG }}
          PDF_REF: ${{ env.TAG || github.sha }}
          RENDERN: ${{ needs.auswahl.outputs.rendern }}
        run: |
          read -ra namen <<<"$RENDERN"
          scripts/analysen-pdf.sh dist/analysen "${namen[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analysen-pdf
          path: dist/analysen/*.pdf
          if-no-files-found: error
      - name: An das Release hängen
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/analysen/*.pdf --clobber

  provenienz:
    # Build-Provenance (SLSA, Sigstore) über alle PDFs des Releases, auch die aus dem
    # vorherigen Release übernommenen; das Bundle hängt als analysen-pdf.intoto.jsonl
    # am Release (OpenSSF Scorecard, Signed-Releases; SYSR-SEC-005). Prüfen mit
    #   gh attestation verify analyse-<name>.pdf -R the78mole/PredictionDB
    name: Provenance der Analysen-PDFs
    needs: [auswahl, pdf]
    if: >-
      always() && needs.auswahl.result == 'success' &&
      needs.pdf.result != 'failure' && needs.pdf.result != 'cancelled' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: write      # gh release download/upload
      id-token: write      # Sigstore-Zertifikat (keyless)
      attestations: write  # Attestation im Repo ablegen
    steps:
      - name: PDFs des Releases laden
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'analyse-*.pdf' -D dist/analysen
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        if: env.TAG != ''
        with:
          subject-path: dist/analysen/*.pdf
      - name: Bundle an das Release hängen
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" analysen-pdf.intoto.jsonl
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" analysen-pdf.intoto.jsonl --clobber
