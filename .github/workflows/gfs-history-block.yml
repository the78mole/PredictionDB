name: GFS-Historie (Block)

# Ein Block des Workflows gfs-history.yml: je Matrix-Eintrag ein Monat einer Laufzeit.
# Höchstens 8 Jobs gleichzeitig, damit Actions und das AWS-Archiv nicht überlastet werden.
on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
      config:
        type: string
        default: config/sources/gfs_0p25.yaml
      archive_concurrency:
        type: string
        default: "16"
      start:
        type: string
        required: true
      end:
        type: string
        default: ""
      rebuild:
        type: boolean
        default: false
      #: Kopf-Inventare aus dem Job "Kopf-Inventare" desselben Laufs (Artefakt gfs-templates)
      templates:
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  month:
    name: ${{ matrix.month }} ${{ matrix.hour }}Z
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    env:
      WX_EXCHANGE_REPOSITORY: the78mole/predictiondb-data/gfs-0p25-silver
      WX_EXCHANGE_USERNAME: ${{ github.actor }}
      WX_EXCHANGE_TOKEN: ${{ github.token }}
      PDB_LOG_JSON: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          save-cache: false
      - run: uv sync --locked --no-dev --package wx-exchange
      - name: Kopf-Inventare holen
        if: inputs.templates
        env:
          GH_TOKEN: ${{ github.token }}
        # Ohne Vorlagen baut der Job sie selbst; daher kein Abbruch
        run: gh run download "$GITHUB_RUN_ID" -n gfs-templates -R "$GITHUB_REPOSITORY" || true
      - name: Monat laden, verdichten und nach GHCR
        env:
          CONFIG: ${{ inputs.config }}
          CONCURRENCY: ${{ inputs.archive_concurrency }}
          MONTH: ${{ matrix.month }}
          HOUR: ${{ matrix.hour }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          args=(gfs --config "$CONFIG" publish "$MONTH" "$HOUR" --start "$START" --parallel-runs 2
                --archive-concurrency "$CONCURRENCY")
          [ -n "$END" ] && args+=(--end "$END")
          [ "$REBUILD" = "true" ] && args+=(--rebuild)
          [ -f templates.json ] && args+=(--templates templates.json)
          uv run --no-sync wx-exchange "${args[@]}"
