name: GFS-Historie

# Baut die GFS-Historie im Runner statt auf der gedrosselten VM: Je Job ein Monat einer
# Laufzeit, Bronze nur im Runner, Silber als OCI-Artefakt nach
# ghcr.io/the78mole/predictiondb-data/gfs-0p25-silver (Tag JJJJ-MM-HHz). Die VM holt das
# Silber mit `wx-exchange gfs import` (Compose-Profil history).
#
# Reihenfolge: Blöcke zu block_years Jahren vom jüngsten Monat rückwärts; im Block erst alle
# Monate der ersten Laufzeit in `runs` (jüngste zuerst), dann der nächsten. Der Plan liest den
# Stand aus den Manifesten in GHCR und nimmt nur Monate mit Lücken auf; ein erneuter Start
# setzt also fort, wo der letzte aufgehört hat.
#
# Mit source: gdex kommen die Läufe vor GFS v16 (bis 2021-03-22 06Z) aus dem NCAR-Archiv GDEX
# d084001 (config/sources/gfs_0p25_gdex.yaml, CC BY 4.0, dreistündlich bis 240 h). Standard ist
# dann der Pilot mit GFS v15 ab 2019-06-12 12Z. Beide Quellen schreiben in dasselbe Paket; im
# März 2021 teilen sie sich die Tags, getrennt durch start/end.
#
# Täglich per Zeitplan holt der Workflow die neuen Läufe aus dem AWS-Archiv (nicht von der VM,
# deren Live-Läufe über NOMADS kommen und um wenige Int16-Stufen abweichen). Ohne Eingaben
# gelten die Standardwerte unten. GitHub pausiert Zeitpläne nach 60 Tagen ohne Commit.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Archiv (aws ab GFS v16, gdex davor)
        type: choice
        options: [aws, gdex]
        default: aws
      start:
        description: Frühester Lauf (leer = 2021-03-22T12 bei aws, 2019-06-12T12 bei gdex)
        default: ""
      end:
        description: Spätester Lauf (leer = vor dem 30-h-Live-Fenster bzw. 2021-03-22T06)
        default: ""
      runs:
        description: Laufzeiten in Reihenfolge der Priorität
        default: 0,12,6,18
      block_years:
        description: Jahre je Block (jüngster Block zuerst)
        default: "3"
      concurrency:
        description: Gleichzeitige Anfragen je Job ans Archiv (leer = 16 bei aws, 96 bei gdex)
        default: ""
      rebuild:
        description: Vorhandene Läufe neu bauen, nur Änderungen hochladen
        type: boolean
        default: false

concurrency:
  group: gfs-history
  cancel-in-progress: false

permissions:
  contents: read

env:
  WX_EXCHANGE_REPOSITORY: the78mole/predictiondb-data/gfs-0p25-silver
  PDB_LOG_JSON: "false"
  # Log sofort zeigen, nicht erst gepuffert am Ende
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    name: Lücken planen
    runs-on: ubuntu-26.04
    outputs:
      block1: ${{ steps.plan.outputs.block1 }}
      block2: ${{ steps.plan.outputs.block2 }}
      block3: ${{ steps.plan.outputs.block3 }}
      config: ${{ steps.source.outputs.config }}
      start: ${{ steps.source.outputs.start }}
      end: ${{ steps.source.outputs.end }}
      concurrency: ${{ steps.source.outputs.concurrency }}
      templates: ${{ steps.source.outputs.templates }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          save-cache: false
      - run: uv sync --locked --no-dev --package wx-exchange
      - id: source
        env:
          SOURCE: ${{ inputs.source || 'aws' }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          if [ "$SOURCE" = "gdex" ]; then
            config=config/sources/gfs_0p25_gdex.yaml
            start=${START:-2019-06-12T12}; end=${END:-2021-03-22T06}; concurrency=${CONCURRENCY:-96}
            templates=true
          else
            config=config/sources/gfs_0p25.yaml
            start=${START:-2021-03-22T12}; end=$END; concurrency=${CONCURRENCY:-16}
            templates=false
          fi
          { echo "config=$config"; echo "start=$start"; echo "end=$end"
            echo "concurrency=$concurrency"; echo "templates=$templates"; } >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          CONFIG: ${{ steps.source.outputs.config }}
          START: ${{ steps.source.outputs.start }}
          END: ${{ steps.source.outputs.end }}
          RUNS: ${{ inputs.runs || '0,12,6,18' }}
          BLOCK_YEARS: ${{ inputs.block_years || '3' }}
          REBUILD: ${{ inputs.rebuild == true }}
        run: |
          args=(gfs --config "$CONFIG" plan "$START")
          [ -n "$END" ] && args+=("$END")
          args+=(--runs "$RUNS" --block-years "$BLOCK_YEARS" --blocks 3)
          [ "$REBUILD" = "true" ] && args+=(--all)
          uv run --no-sync wx-exchange "${args[@]}"

  # GDEX hat keine .idx: Kopf-Inventare (Vorlagen) einmal für alle Monatsjobs bauen, statt
  # dass jeder Job sie im ersten Lauf neu liest. Die Nachrichtenfolge ist innerhalb einer
  # GFS-Version fest; passt eine Vorlage nicht, baut der Monatsjob sie selbst.
  templates:
    name: Kopf-Inventare
    needs: plan
    if: needs.plan.outputs.templates == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          save-cache: false
      - run: uv sync --locked --no-dev --package wx-exchange
      - env:
          CONFIG: ${{ needs.plan.outputs.config }}
          RUN: ${{ needs.plan.outputs.start }}
          CONCURRENCY: ${{ needs.plan.outputs.concurrency }}
        run: |
          uv run --no-sync wx-exchange gfs --config "$CONFIG" templates "$RUN" \
            --out templates.json --archive-concurrency "$CONCURRENCY"
      - uses: actions/upload-artifact@v7
        with:
          name: gfs-templates
          path: templates.json
          retention-days: 3

  block1:
    needs: [plan, templates]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.block1 != '[]' }}
    uses: ./.github/workflows/gfs-history-block.yml
    with:
      matrix: ${{ needs.plan.outputs.block1 }}
      config: ${{ needs.plan.outputs.config }}
      start: ${{ needs.plan.outputs.start }}
      end: ${{ needs.plan.outputs.end }}
      archive_concurrency: ${{ needs.plan.outputs.concurrency }}
      templates: ${{ needs.templates.result == 'success' }}
      rebuild: ${{ inputs.rebuild == true }}
    permissions:
      actions: read
      contents: read
      packages: write

  block2:
    needs: [plan, templates, block1]
    if: ${{ !cancelled() && needs.plan.outputs.block2 != '[]' }}
    uses: ./.github/workflows/gfs-history-block.yml
    with:
      matrix: ${{ needs.plan.outputs.block2 }}
      config: ${{ needs.plan.outputs.config }}
      start: ${{ needs.plan.outputs.start }}
      end: ${{ needs.plan.outputs.end }}
      archive_concurrency: ${{ needs.plan.outputs.concurrency }}
      templates: ${{ needs.templates.result == 'success' }}
      rebuild: ${{ inputs.rebuild == true }}
    permissions:
      actions: read
      contents: read
      packages: write

  block3:
    needs: [plan, templates, block2]
    if: ${{ !cancelled() && needs.plan.outputs.block3 != '[]' }}
    uses: ./.github/workflows/gfs-history-block.yml
    with:
      matrix: ${{ needs.plan.outputs.block3 }}
      config: ${{ needs.plan.outputs.config }}
      start: ${{ needs.plan.outputs.start }}
      end: ${{ needs.plan.outputs.end }}
      archive_concurrency: ${{ needs.plan.outputs.concurrency }}
      templates: ${{ needs.templates.result == 'success' }}
      rebuild: ${{ inputs.rebuild == true }}
    permissions:
      actions: read
      contents: read
      packages: write
