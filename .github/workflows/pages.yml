name: Pages

# Projektseite auf GitHub Pages: Landing Page mit Kacheln (pages/), darunter der
# StrictDoc-Export des kompletten Anforderungssets mit Traceability (reqs/) und
# die Testberichte (tests/) des letzten CI-Laufs auf main. Läuft nach jedem
# abgeschlossenen CI-Lauf auf main, auch wenn Tests rot sind (der Bericht zeigt
# dann die Fehler). Abgebrochene Läufe werden übersprungen.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Seite bauen
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read  # Testberichte aus dem CI-Lauf holen
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # Default-Branch auschecken, dann nur auf einen Commit wechseln, der auf
      # main liegt (SYSR-SEC-001, kein Checkout von head_sha im workflow_run)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit von main auschecken
        run: scripts/main-commit-auschecken.sh "$SHA"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: false
      - run: uv sync --locked --all-packages
      - run: uv run python reqs/pruefen.py
      - run: uv run strictdoc export reqs --output-dir build/strictdoc
      - run: mkdir -p build/pages && cp -r build/strictdoc/html build/pages/reqs
      # Testberichte: beim CI-Auslöser genau dieser Lauf, sonst der letzte
      # erfolgreich abgeschlossene CI-Lauf auf main.
      - name: CI-Lauf bestimmen
        id: lauf
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch main --event push --status completed --limit 1 \
              --json databaseId -q '.[0].databaseId')
          fi
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true  # fehlt ein Bericht, zeigt die Kachel das an
        with:
          pattern: testbericht-*
          merge-multiple: true
          path: build/pages/tests
          run-id: ${{ steps.lauf.outputs.id }}
          github-token: ${{ github.token }}
      - name: Landing Page
        env:
          GH_TOKEN: ${{ github.token }}  # Stars/Issues/PRs für die GitHub-Ecke
          CI_RUN_ID: ${{ steps.lauf.outputs.id }}
          COMMIT_SHA: ${{ env.SHA }}
        run: uv run python pages/build_site.py build/pages
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages

  deploy:
    name: Auf Pages veröffentlichen
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
