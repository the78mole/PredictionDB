name: Release

# Nach jeder grünen CI auf main: nächste Version nach Semantic Versioning
# berechnen (scripts/naechste-version.sh), Tag und GitHub-Release anlegen und
# die Analyse-PDFs daran hängen. Releases, die mit dem GITHUB_TOKEN entstehen,
# lösen keine weiteren Workflows aus; deshalb wird der PDF-Workflow hier
# direkt aufgerufen.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version und Release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Default-Branch auschecken, dann nur auf einen Commit wechseln, der auf
      # main liegt (SYSR-SEC-001, kein Checkout von head_sha im workflow_run)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Commit von main auschecken
        run: scripts/main-commit-auschecken.sh "$SHA"
      - name: Nächste Version
        id: version
        run: scripts/naechste-version.sh "$SHA"
      - name: Tag und Release anlegen
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          VORHER: ${{ steps.version.outputs.vorher }}
        run: |
          gh release create "$VERSION" --target "$SHA" --title "$VERSION" \
            --generate-notes ${VORHER:+--notes-start-tag "$VORHER"}

  analysen-pdf:
    name: Analysen-PDFs
    needs: version
    if: needs.version.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/analysen-pdf.yml
    with:
      tag: ${{ needs.version.outputs.version }}
