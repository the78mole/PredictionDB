name: Release

# Nach jeder grünen CI auf main: nächste Version nach Semantic Versioning
# berechnen (scripts/naechste-version.sh), Tag und GitHub-Release anlegen und
# das signierte Quellcode-Archiv sowie die Analyse-PDFs daran hängen. Releases, die mit dem GITHUB_TOKEN entstehen,
# lösen keine weiteren Workflows aus; deshalb wird der PDF-Workflow hier
# direkt aufgerufen.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version und Release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Default-Branch auschecken, dann nur auf einen Commit wechseln, der auf
      # main liegt (SYSR-SEC-001, kein Checkout von head_sha im workflow_run)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit von main auschecken
        run: scripts/main-commit-auschecken.sh "$SHA"
      - name: Nächste Version
        id: version
        run: scripts/naechste-version.sh "$SHA"
      - name: Tag und Release anlegen
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          VORHER: ${{ steps.version.outputs.vorher }}
        run: |
          gh release create "$VERSION" --target "$SHA" --title "$VERSION" \
            --generate-notes ${VORHER:+--notes-start-tag "$VORHER"}

  analysen-pdf:
    name: Analysen-PDFs
    needs: version
    if: needs.version.outputs.version != ''
    permissions:
      contents: write
      id-token: write      # Provenance der PDFs (Sigstore)
      attestations: write
    uses: ./.github/workflows/analysen-pdf.yml
    with:
      tag: ${{ needs.version.outputs.version }}

  quellcode:
    # Quellcode-Archiv des Release-Commits mit Build-Provenance (SLSA, Sigstore,
    # keyless), damit auch der Quellcode signiert ist und nicht nur Images und
    # PDFs (Best Practices signed_releases, SYSR-SEC-005). Prüfen mit
    #   gh attestation verify PredictionDB-<tag>.tar.gz -R the78mole/PredictionDB
    name: Quellcode-Archiv
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write      # gh release upload
      id-token: write      # Sigstore-Zertifikat (keyless)
      attestations: write  # Attestation im Repo ablegen
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Commit von main auschecken
        run: scripts/main-commit-auschecken.sh "$SHA"
      - name: Archiv und Prüfsumme
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="PredictionDB-$VERSION/" \
            -o "dist/PredictionDB-$VERSION.tar.gz" "$SHA"
          (cd dist && sha256sum "PredictionDB-$VERSION.tar.gz" > "PredictionDB-$VERSION.tar.gz.sha256")
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: dist/PredictionDB-${{ needs.version.outputs.version }}.tar.gz
      - name: An das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" dist/quellcode.intoto.jsonl
          gh release upload "$VERSION" -R "$GITHUB_REPOSITORY" --clobber \
            "dist/PredictionDB-$VERSION.tar.gz" "dist/PredictionDB-$VERSION.tar.gz.sha256" \
            dist/quellcode.intoto.jsonl
