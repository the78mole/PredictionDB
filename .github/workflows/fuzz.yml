name: Fuzzing

# Abdeckungsgesteuertes Fuzzing der Parser für Eingaben von außen (SYSR-SEC-009) mit
# Atheris (libFuzzer): GHCR-Artefakte (Tar, Manifeste) und ENTSO-E-Antworten. gribkit wird
# im eigenen Repository gefuzzt. Läuft wöchentlich und bei Änderungen an den Parsern oder am
# Fuzzer je Ziel einige Minuten; die schnellen Property-Tests mit Hypothesis laufen dagegen in
# der normalen CI. Ein Fund lässt den Job rot werden und hängt die auslösende Eingabe
# (crash-*) als Artefakt an. Der gewachsene Korpus wird zwischen den Läufen im Cache
# gehalten, der Startkorpus liegt unter fuzz/korpus/.

on:
  schedule:
    - cron: "41 3 * * 0"
  push:
    branches: [main]
    paths:
      - services/wx_exchange/src/**
      - services/energy_ingest/src/energy_ingest/sources/**
      - fuzz/**
      - .github/workflows/fuzz.yml
  pull_request:
    paths:
      - services/wx_exchange/src/**
      - services/energy_ingest/src/energy_ingest/sources/**
      - fuzz/**
      - .github/workflows/fuzz.yml
  workflow_dispatch:
    inputs:
      sekunden:
        description: Laufzeit je Ziel in Sekunden
        default: "600"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzzing ${{ matrix.ziel }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        ziel: [tar, manifest, entsoe]
    env:
      # Pull Requests kurz, sonst länger
      SEKUNDEN: ${{ inputs.sekunden || (github.event_name == 'pull_request' && '120') || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: false
      - run: uv sync --locked --all-packages --group fuzz
      - name: Korpus aus früheren Läufen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: korpus
          key: fuzz-korpus-${{ matrix.ziel }}-${{ github.run_id }}
          restore-keys: fuzz-korpus-${{ matrix.ziel }}-
      - name: Fuzzen
        run: |
          mkdir -p korpus funde
          cp -n fuzz/korpus/"$ZIEL"/* korpus/ 2>/dev/null || true
          uv run --no-sync python fuzz/predictiondb_fuzz.py "$ZIEL" \
            -max_total_time="$SEKUNDEN" -timeout=10 -rss_limit_mb=2048 \
            -artifact_prefix=funde/ korpus
        env:
          ZIEL: ${{ matrix.ziel }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-funde-${{ matrix.ziel }}
          path: funde/
          retention-days: 30
