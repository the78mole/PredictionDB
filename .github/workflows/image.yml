name: Image

# Nach jeder grünen CI auf main: App-Image bauen und nach GHCR schieben, mit den
# Tags <commit-sha> und latest. Das Auto-Update auf der VM (scripts/vm-update.sh)
# zieht das Image zum Commit von main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: Image nach GHCR
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write      # Provenance des Images (Sigstore, keyless)
      attestations: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE: ghcr.io/the78mole/predictiondb
    steps:
      # Default-Branch auschecken, dann nur auf einen Commit wechseln, der auf
      # main liegt (SYSR-SEC-001, kein Checkout von head_sha im workflow_run)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit von main auschecken
        run: scripts/main-commit-auschecken.sh "$SHA"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Build-Provenance (SLSA) als signierte Attestation am Image in GHCR (SYSR-SEC-005),
      # prüfen mit: gh attestation verify oci://ghcr.io/the78mole/predictiondb:<tag> -R the78mole/PredictionDB
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
