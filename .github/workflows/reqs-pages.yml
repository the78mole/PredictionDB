name: Anforderungen auf Pages

# StrictDoc-Export des kompletten Anforderungssets unter reqs/ mit Traceability
# (Matrix, Quellcode-Verweise, Abdeckung) als GitHub Pages. Läuft nach jedem Push
# auf main, der Anforderungen oder Python-Code ändert.

on:
  push:
    branches: [main]
    paths:
      - "reqs/**"
      - "**/*.py"
      - ".github/workflows/reqs-pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: StrictDoc exportieren
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          save-cache: false
      - run: uv sync --locked --all-packages
      - run: uv run python reqs/pruefen.py
      - run: uv run strictdoc export reqs --output-dir build/reqs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/reqs/html

  deploy:
    name: Auf Pages veröffentlichen
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
