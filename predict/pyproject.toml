[project]
name = "pdb-predict"
version = "0.1.0"
description = "Schlanker Prognose-Dienst: ein Modellpaket, Eingänge direkt von freien Quellen, Ausgabe als Dateien und HTTP"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-BUSL-1.1"
dependencies = [
    "predictiondb-core",
    "ml-train",
    "energy-ingest",
    "wx-ingest",
    "wx-process",
    "gribkit",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=18",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6",
]

[project.scripts]
pdb-predict = "pdb_predict.cli:main"

[tool.uv.sources]
predictiondb-core = { workspace = true }
ml-train = { workspace = true }
energy-ingest = { workspace = true }
wx-ingest = { workspace = true }
wx-process = { workspace = true }
gribkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdb_predict"]
